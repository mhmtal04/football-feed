name: Update football fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: football-feed
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect public fixtures
        run: python scraper.py

      - name: Synchronize repository
        run: git pull --rebase origin main

      - name: Publish JSON feed
        run: |
          git add public/external-matches.json public/scrape-status.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update public football fixtures"
            git push origin HEAD:main
          fi
