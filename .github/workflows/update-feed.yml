name: Update football fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: football-feed
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect public fixtures
        run: python scraper.py

      - name: Commit generated feed
        run: |
          git add public/external-matches.json public/scrape-status.json

          if git diff --cached --quiet; then
            echo "No feed changes to publish."
            exit 0
          fi

          git commit -m "Update public football fixtures"

      - name: Rebase and publish
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt of 5"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict: stopping without overwriting remote changes."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Feed published successfully."
              exit 0
            fi

            echo "Push rejected; retrying after fetching latest changes..."
            sleep 3
          done

          echo "Could not publish after 5 attempts."
          exit 1
